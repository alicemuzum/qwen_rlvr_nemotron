[project]
name = "reasoners-grpo-kaggle"
version = "0.1.0"
description = "Synthetic reasoning-task corpus generation + reward functions, with a GRPO training script for Kaggle/Colab GPUs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "trl>=0.12.0",
    "peft>=0.13.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",
    "datasets>=3.0.0",
]

[project.optional-dependencies]
# Stage-2 SFT via the Tinker hosted API (kaggle/train_sft_tinker.py) instead
# of a local GPU. Kept optional since it needs no torch/peft/bitsandbytes
# stack and most of this repo's other entry points don't touch it.
tinker = [
    "tinker>=0.16.1",
    "tinker-cookbook>=0.3.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reasoners"]
